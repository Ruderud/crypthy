name: Installer smoke test

# Windows 설치형 업데이트 확인 (최신 릴리스 → 이 커밋의 빌드):
#   update: 최신 릴리스를 설치·실행해 둔 채 새 설치 파일을 electron-updater 와 같은 인자(--updated /S --force-run)로 실행
#           → 새 버전으로 바뀌고, 실행되고, 사용자 데이터가 남아야 한다
#   ota:    설치한 앱이 로컬 업데이트 서버에서 새 버전을 받고 앱 안의 "재시작해 설치"로 직접 설치 (CDP 로 조작)
#           → 버전이 같으면(릴리스 직후 커밋) 건너뛴다
#   locked: Crypthy.exe 를 다른 프로세스가 공유 없이 붙잡고 있으면 오류를 보이고 끝나며 반쯤 설치된 앱을 실행하지 않아야 한다
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        scenario: [update, ota, locked]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build the NSIS installer (no publish)
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Download the latest released installer
        shell: bash
        run: |
          tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          echo "previous release: $tag"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "Crypthy-${tag#v}-setup-x64.exe" -D prev
      - name: Update while the app is running (${{ matrix.scenario }})
        if: matrix.scenario != 'ota'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $from = (Get-ChildItem prev\*.exe)[0].FullName
          $to = "release\Crypthy-$version-setup-x64.exe"
          $lock = '${{ matrix.scenario }}' -eq 'locked'
          ./scripts/smoke-update.ps1 -From $from -To $to -ExpectVersion "$version.0" -Lock:$lock
      - name: In-app update (download, then restart to install)
        if: matrix.scenario == 'ota'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $from = (Get-ChildItem prev\*.exe)[0]
          if ($from.Name -eq "Crypthy-$version-setup-x64.exe") { "same version as the latest release ($version) - skipped"; exit 0 }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Crypthy'
          $exe = Join-Path $dir 'Crypthy.exe'
          (Start-Process $from.FullName -ArgumentList '/S' -PassThru).WaitForExit()
          "installed $((Get-Item $exe).VersionInfo.ProductVersion)"
          New-Item -ItemType Directory serve | Out-Null
          Copy-Item release\latest.yml, "release\Crypthy-$version-setup-x64.exe", "release\Crypthy-$version-setup-x64.exe.blockmap" serve\
          # 설치한 앱의 업데이트 서버를 로컬 generic 서버로 바꾼다
          Set-Content -Path "$dir\resources\app-update.yml" -Value "provider: generic`nurl: http://127.0.0.1:8765/`nupdaterCacheDirName: crypthy-updater"
          $srv = Start-Process python -ArgumentList '-m', 'http.server', '8765', '-d', 'serve' -PassThru -WindowStyle Hidden
          Start-Process $exe -ArgumentList '--remote-debugging-port=9333' | Out-Null
          node scripts/smoke-ota.mjs 9333
          if ($LASTEXITCODE) { exit 1 }
          $v = $null
          for ($k = 0; $k -lt 24; $k++) {
            Start-Sleep 5
            $v = (Get-Item $exe -ea SilentlyContinue).VersionInfo.ProductVersion
            $running = Get-CimInstance Win32_Process | Where-Object { $_.Path -eq $exe }
            "{0,3}s version={1} running={2}" -f (($k + 1) * 5), $v, [bool]$running
            if ($v -eq "$version.0" -and $running) { break }
          }
          Get-Process Crypthy -ea SilentlyContinue | Stop-Process -Force -ea SilentlyContinue
          Stop-Process -Id $srv.Id -Force -ea SilentlyContinue
          if ($v -ne "$version.0" -or -not $running) { "FAIL: in-app update did not end on $version running"; exit 1 }
          'OK'
