name: Release

# v* 태그를 push 하면 Windows x64 설치 파일을 빌드해 GitHub Release 에 올린다.
# 업로드: NSIS 설치 파일, blockmap, latest.yml(자동 업데이트용), zip, SHA256SUMS.txt
# 코드 서명은 하지 않는다 (README 참고).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package.json version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != package.json v${version}" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Build and publish to GitHub Release
        run: npx electron-builder --win --x64 --publish always

      - name: Upload SHA256SUMS
        shell: bash
        run: |
          node scripts/checksums.mjs
          gh release upload "${GITHUB_REF_NAME}" release/SHA256SUMS.txt --clobber
